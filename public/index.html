<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VaxGuard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
body{background:#070D18;color:#E7EDF6;font-family:sans-serif;padding:16px;max-width:680px;margin:auto}
h2{background:linear-gradient(90deg,#4BA3E8,#34C77B);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:2px}
.card{background:#101B2E;border:1px solid #223350;border-radius:10px;padding:16px;margin-bottom:12px}
.big{font-size:32px;font-weight:bold}
.SAFE{color:#34C77B}.WATCH{color:#E8B84B}.WARNING{color:#E8862E}.CRITICAL{color:#E5484D}.SENSOR_FAULT{color:#9B7BE0}.RECOVERY{color:#4BA3E8}
button{background:#234164;color:#fff;border:1px solid #2E4E75;padding:10px 14px;border-radius:8px;cursor:pointer;margin:4px 4px 4px 0;font-size:14px}
button.demo-normal.active{background:#1F7A46}
button.demo-warn.active{background:#B8860B}
button.demo-high.active,button.demo-low.active{background:#B8332D}
button.demo-off.active{background:#3A4A63}
.row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid #182338}
small{color:#8CA0BE}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:bold;margin-left:6px}
.pill.demo{background:#3A2E14;color:#E8B84B}
.pill.real{background:#123322;color:#34C77B}
</style></head>
<body>
<h2>🛡️ VaxGuard</h2>
<small>AI-assisted vaccine cold-chain monitor <span id="modePill" class="pill real">REAL</span></small>

<div class="card">
  <div>Temperature</div><div class="big" id="temp">--°C</div>
  <div>State</div><div class="big" id="state">--</div>
  <div class="row"><span>Humidity</span><span id="hum">--%</span></div>
  <div class="row"><span>Vibration (10s window)</span><span id="vib">--</span></div>
  <div class="row"><span>Last update</span><span id="lastUpdate">--</span></div>
</div>

<div class="card">
  <div style="margin-bottom:8px"><b>Demo Mode</b> — instant, controls the ESP32 LEDs live</div>
  <button class="demo-normal" onclick="setDemo('NORMAL')">🟢 Normal</button>
  <button class="demo-warn" onclick="setDemo('WARN')">🟡 Warning (yellow blink)</button>
  <button class="demo-high" onclick="setDemo('HIGH')">🔴 High (red blink)</button>
  <button class="demo-low" onclick="setDemo('LOW')">🔴 Low (red blink)</button>
  <button class="demo-off" onclick="setDemo('OFF')">⏹ Off (real sensors)</button>
</div>

<div class="card">
  <div>AI Insight</div>
  <div id="insightText" style="font-size:14px;line-height:1.5;margin-top:6px">Loading…</div>
</div>

<div class="card">
  <div>Temperature History</div>
  <canvas id="chart" height="160"></canvas>
</div>

<div class="card">
  <div>Recent Alerts</div>
  <div id="alertsList" style="margin-top:6px">Loading…</div>
</div>

<div class="card">
  <div>Thresholds</div>
  <input id="cfgLower" placeholder="Lower °C" style="width:45%;padding:6px;margin-right:6px;background:#16233A;border:1px solid #223350;color:#fff;border-radius:6px">
  <input id="cfgUpper" placeholder="Upper °C" style="width:45%;padding:6px;background:#16233A;border:1px solid #223350;color:#fff;border-radius:6px">
  <button onclick="saveConfig()" style="margin-top:8px">Save</button>
  <div id="cfgStatus" style="font-size:12px;margin-top:6px"></div>
</div>

<script>
let chart = null;

async function refreshLatest() {
  try {
    const r = await fetch('/api/sensors/latest?deviceId=VAX-001');
    const d = await r.json();
    if (d) {
      document.getElementById('temp').textContent = (d.temperature != null ? d.temperature.toFixed(1) : '--') + '°C';
      document.getElementById('hum').textContent = (d.humidity != null && d.humidity >= 0 ? d.humidity.toFixed(0) : '--') + '%';
      document.getElementById('vib').textContent = d.vibrationCount || 0;
      document.getElementById('state').textContent = d.state;
      document.getElementById('state').className = 'big ' + d.state;
      document.getElementById('lastUpdate').textContent = new Date(d.receivedAt).toLocaleTimeString();
      const pill = document.getElementById('modePill');
      pill.textContent = d.simulated ? 'DEMO' : 'REAL';
      pill.className = 'pill ' + (d.simulated ? 'demo' : 'real');
    }
  } catch (e) {}
}

async function refreshDemoButtons() {
  try {
    const r = await fetch('/api/demo');
    const d = await r.json();
    document.querySelectorAll('[class^=demo-],[class*=" demo-"]').forEach(b => b.classList.remove('active'));
    const map = { NORMAL: '.demo-normal', WARN: '.demo-warn', HIGH: '.demo-high', LOW: '.demo-low', OFF: '.demo-off' };
    const sel = document.querySelector(map[d.active ? d.level : 'OFF']);
    if (sel) sel.classList.add('active');
  } catch (e) {}
}

async function setDemo(level) {
  await fetch('/api/demo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ level }) });
  refreshDemoButtons();
}

async function loadInsight() {
  try {
    const r = await fetch('/api/ai/insights?deviceId=VAX-001');
    const d = await r.json();
    if (d.message) { document.getElementById('insightText').textContent = d.message; return; }
    document.getElementById('insightText').innerHTML =
      `Mode: <b>${d.mode}</b> · Trend: <b>${d.trend.direction}</b> · Risk score: <b>${d.riskScore}/100</b><br>` +
      `Cold-chain quality (estimate): <b>${d.coldChainQuality.score}/100 — ${d.coldChainQuality.label}</b><br>` +
      `<small>${d.coldChainQuality.disclaimer}</small>`;
  } catch (e) {}
}

async function loadChart() {
  try {
    const r = await fetch('/api/history?range=1h&deviceId=VAX-001');
    const d = await r.json();
    const labels = d.series.map(p => new Date(p.t).toLocaleTimeString());
    const temps = d.series.map(p => p.temperature);
    if (chart) chart.destroy();
    chart = new Chart(document.getElementById('chart'), {
      type: 'line',
      data: { labels, datasets: [{ label: 'Temperature °C', data: temps, borderColor: '#4BA3E8', tension: 0.2, pointRadius: 0 }] },
      options: { animation: false, scales: { x: { ticks: { color: '#8CA0BE', maxTicksLimit: 6 } }, y: { ticks: { color: '#8CA0BE' } } }, plugins: { legend: { labels: { color: '#E7EDF6' } } } }
    });
  } catch (e) {}
}

async function loadAlerts() {
  try {
    const r = await fetch('/api/alerts');
    const d = await r.json();
    document.getElementById('alertsList').innerHTML = d.length ? d.map(e =>
      `<div class="row"><span class="${e.severity}">${e.severity}${e.simulated ? ' (demo)' : ''}</span><span>${e.reason}</span><small>${new Date(e.timestamp).toLocaleTimeString()}</small></div>`
    ).join('') : 'No alerts yet.';
  } catch (e) {}
}

async function saveConfig() {
  const lower = parseFloat(document.getElementById('cfgLower').value);
  const upper = parseFloat(document.getElementById('cfgUpper').value);
  if (isNaN(lower) || isNaN(upper)) { document.getElementById('cfgStatus').textContent = 'Enter valid numbers.'; return; }
  const r = await fetch('/api/config', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tempLower: lower, tempUpper: upper }) });
  const d = await r.json();
  document.getElementById('cfgStatus').textContent = d.ok ? 'Saved (v' + d.config.configVersion + ')' : 'Save failed';
}

async function loadConfigIntoForm() {
  const cfg = await (await fetch('/api/config')).json();
  document.getElementById('cfgLower').value = cfg.tempLower;
  document.getElementById('cfgUpper').value = cfg.tempUpper;
}

// live loop — fast polling for near real-time feel
refreshLatest(); refreshDemoButtons(); loadInsight(); loadChart(); loadAlerts(); loadConfigIntoForm();
setInterval(refreshLatest, 1500);
setInterval(refreshDemoButtons, 2000);
setInterval(loadInsight, 5000);
setInterval(loadChart, 8000);
setInterval(loadAlerts, 8000);
</script>
</body>
</html>
