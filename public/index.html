<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaxGuard — Cold Chain Sentinel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="modeband" id="modeband">
    <span id="modeText">DEMO MODE — Simulated Data</span>
  </div>

  <header class="topbar">
    <div class="brand">
      <strong>VaxGuard</strong>
      <span>AI Cold-Chain Sentinel v3.0</span>
    </div>
    <div>
      <span class="pill" id="wifiPill">WIFI —</span>
      <button class="btn" id="modeToggleBtn">Switch Mode</button>
    </div>
  </header>

  <main class="container">
    <!-- Live Status -->
    <section class="card">
      <h1 id="severityLevel">NORMAL</h1>
      <p id="severitySub">Waiting for first reading...</p>

      <div class="stats">
        <div class="stat">
          <small>Temperature</small>
          <div id="tempValue">-- °C</div>
        </div>
        <div class="stat">
          <small>Humidity</small>
          <div id="humValue">-- %</div>
        </div>
        <div class="stat">
          <small>Vibration</small>
          <div id="vibValue">--</div>
        </div>
        <div class="stat">
          <small>Risk Score</small>
          <div id="riskValue">--</div>
        </div>
      </div>

      <p id="explanationText" class="explanation"></p>
      <p id="recommendationText" class="recommendation"></p>
      <p id="mythText" class="myth"></p>
    </section>

    <!-- Demo Controls -->
    <section class="card" id="demoPanel">
      <h3>Demo Control Panel</h3>
      <div class="btn-grid">
        <button class="demo-btn" data-cmd="normal">Normal</button>
        <button class="demo-btn" data-cmd="low">Low Temp</button>
        <button class="demo-btn" data-cmd="high">High Temp</button>
        <button class="demo-btn" data-cmd="warning">Warning</button>
        <button class="demo-btn danger" data-cmd="danger">Danger</button>
        <button class="demo-btn" data-cmd="vibration">Vibration</button>
        <button class="demo-btn" data-cmd="novibration">No Vibration</button>
        <button class="demo-btn" data-cmd="sensorfault">Sensor Fault</button>
        <button class="demo-btn" data-cmd="recovery">Recovery</button>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
